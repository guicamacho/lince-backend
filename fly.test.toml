# lince-api-test — the TEST tier (Environments & Promotion Strategy 262373377):
# Avenia SANDBOX keys, disposable data, near-prod config flags. Deployed by CI from the
# `staging` branch (promotion = merge dev -> staging).
#
# PUBLIC on purpose (unlike dev): the test tier is "loose; internal" per the strategy, and
# a public https URL lets Avenia/Clerk webhooks reach it without Cloudflare tunnel work.
# /admin stays service-token + verified-actor gated; extend CF Access here later if wanted.
app = "lince-api-test"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  CUSTOMER_APP_URL = "https://lince-customer-test.fly.dev"
  # Near-prod posture — the flags that are OFF on dev are ON here (readiness §4):
  STEP_UP_ENFORCED = "true"
  RATE_LIMIT_ENFORCED = "true"
  # Public fly.dev: exactly one trusted hop (Fly's edge proxy).
  TRUST_PROXY_HOPS = "1"
  NOTIFY_APP_BASE_URL = "https://lince-customer-test.fly.dev"

[deploy]
  release_command = "node --import tsx db/migrate.ts"

[http_service]
  internal_port = 3000
  force_https = true
  # The in-process scheduler (drains, sweeps, recon) must keep running: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
