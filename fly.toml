app = "lince-api-dev"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  CUSTOMER_APP_URL = "https://lince-customer.fly.dev"

# Private-only: this app has NO public service, so Fly allocates no public IPs and
# *.fly.dev is dark. It is reached solely via the Cloudflare Tunnel over Fly's 6PN
# private network at http://lince-api-dev.internal:3000 (see the lince-cf-tunnel app).
# With no service there is no auto-stop, so the single machine runs continuously
# (Fly restarts it on crash); cloudflared reconnects to it automatically.

# Runs migrations before each release goes live (uses the DATABASE_URL secret).
[deploy]
  release_command = "node --import tsx db/migrate.ts"
