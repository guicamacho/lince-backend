app = "lince-dev"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"

# Runs migrations before each release goes live (uses the DATABASE_URL secret).
[deploy]
  release_command = "node --import tsx db/migrate.ts"
